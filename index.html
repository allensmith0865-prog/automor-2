/* ════════════════════════════════════════════════════════════
   ADMIN LOGIN MODAL
   ════════════════════════════════════════════════════════════ */
function AdminLogin({ onSuccess, onClose, adminPw }) {
  const [pw,setPw]=useState(""); const [err,setErr]=useState(""); const [attempts,setAttempts]=useState(0); const [lockUntil,setLockUntil]=useState(0); const [cd,setCd]=useState(0);
  useEffect(()=>{
    if(lockUntil<=0)return;
    const t=setInterval(()=>{ const r=Math.ceil((lockUntil-Date.now())/1000); if(r<=0){setLockUntil(0);setCd(0);setAttempts(0);setErr("");clearInterval(t);}else setCd(r); },400);
    return()=>clearInterval(t);
  },[lockUntil]);
  const login=()=>{
    if(Date.now()<lockUntil){setErr(`Locked — wait ${cd}s`);return;}
    if(pw===adminPw){onSuccess();}
    else{ const na=attempts+1; setAttempts(na); if(na>=3){const u=Date.now()+30000;setLockUntil(u);setErr("Too many attempts. Locked 30s.");}else setErr(`Incorrect. ${3-na} attempt(s) left.`); }
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.96)",backdropFilter:"blur(8px)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="fu" style={{background:C.panelBg,border:`1px solid ${C.border}`,borderRadius:5,maxWidth:360,width:"100%",padding:"32px 28px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:22}}>
          <div style={{width:36,height:36,background:C.accent,borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}><Ic.Lock/></div>
          <div><div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:17,color:C.white}}>Admin Access</div><div style={{color:C.muted,fontSize:11}}>Content Management System</div></div>
        </div>
        <div style={{background:C.accentD,border:"1px solid rgba(232,96,26,.2)",borderRadius:3,padding:"9px 13px",marginBottom:18,fontSize:12,color:C.sub}}>🔒 Restricted — Authorised personnel only.</div>
        <label className="lbl">Password</label>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="Enter admin password…" autoFocus style={{marginBottom:6}} />
        {err&&<p style={{color:C.red,fontSize:12,marginBottom:8}}>{err}{cd>0&&` (${cd}s)`}</p>}
        <button className="bp bfull" style={{marginTop:10}} onClick={login}>Sign In</button>
        <button onClick={onClose} style={{display:"block",width:"100%",textAlign:"center",color:C.muted,fontSize:12,marginTop:12}}>← Cancel</button>
        <div style={{height:1,background:C.border,margin:"16px 0 12px"}} />
        <p style={{color:C.muted,fontSize:11,textAlign:"center",lineHeight:1.7}}>
          URL: <span style={{fontFamily:"'Space Mono',monospace",color:C.sub}}>yoursite.com/#admin</span><br/>
          Shortcut: <span style={{fontFamily:"'Space Mono',monospace",color:C.sub}}>Ctrl+Shift+A</span>
        </p>
      </div>
    </div>
  );
}

        <button onClick={onOpenSecurity} style={{background:"rgba(0,0,0,0.25)",color:"#fff",padding:"5px 12px",borderRadius:3,border:"1px solid rgba(255,255,255,0.2)",fontSize:11,fontFamily:"'Rajdhani',sans-serif",fontWeight:700,letterSpacing:1,cursor:"pointer"}}>🔒 Security</button>
        <button onClick={onExport} style={{background:"#fff",color:C.accent,padding:"5px 14px",borderRadius:3,border:"none",fontSize:11,fontFamily:"'Rajdhani',sans-serif",fontWeight:700,letterSpacing:1,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>

      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════

      </div>
    </div>

  /* ── BRAND & CONTACT ── */
  if (panelId === "brand") {

      <div className="panel-body">
        <div className="fg"><label className="lbl">Site Title</label><input value={f.siteTitle} onChange={e=>setF({...f,siteTitle:e.target.value})} /></div>
        <div className="fg"><label className="lbl">Meta Description</label><textarea rows={3} value={f.metaDesc} onChange={e=>setF({...f,metaDesc:e.target.value})} /><p style={{color:C.muted,fontSize:11,marginTop:3}}>{f.metaDesc.length}/160</p></div>
        <div className="fg"><label className="lbl">Keywords</label><input value={f.keywords} onChange={e=>setF({...f,keywords:e.target.value})} /></div>
        <ImgInput label="OG Image (1200×630px)" val={f.ogImage} set={v=>setF({...f,ogImage:v})} small />
        <div className="fg2">
          <div className="fg"><label className="lbl">Google Analytics ID</label><input value={f.googleAnalyticsId} onChange={e=>setF({...f,googleAnalyticsId:e.target.value})} placeholder="G-XXXXXXXXXX" /></div>
          <div className="fg"><label className="lbl">Search Console Code</label><input value={f.googleVerification} onChange={e=>setF({...f,googleVerification:e.target.value})} /></div>
        </div>
        <div className="fg"><label className="lbl">Canonical Domain</label><input value={f.canonicalDomain} onChange={e=>setF({...f,canonicalDomain:e.target.value})} /></div>
        <div className="fg"><label className="lbl">Robots</label>
          <select value={f.robots} onChange={e=>setF({...f,robots:e.target.value})}>
            <option value="index, follow">index, follow (recommended)</option>
            <option value="noindex, nofollow">noindex, nofollow</option>
          </select>
        </div>
      </div>
      <div className="panel-footer"><button className="bp bfull" onClick={()=>save("seo",f)}>Apply Changes</button></div>
    </div>);
  }

  /* ── SECURITY ── */
  if (panelId === "security") {
    const [cur,setCur]=useState(""); const [nw,setNw]=useState(""); const [cf,setCf]=useState(""); const [msg,setMsg]=useState(null);
    const change=()=>{
      if(cur!==state.adminPw){setMsg({t:"e",m:"Current password incorrect"});return;}
      if(nw.length<6){setMsg({t:"e",m:"Min 6 characters"});return;}
      if(nw!==cf){setMsg({t:"e",m:"Passwords don't match"});return;}
      dispatch({type:"set",key:"adminPw",val:nw}); setCur("");setNw("");setCf("");
      setMsg({t:"s",m:"✓ Password changed!"});setTimeout(()=>setMsg(null),3000);
    };
    return (<div className="panel si">
      <PH title="Security / Password" />
      <div className="panel-body">
        <div className="fg"><label className="lbl">Current Password</label><input type="password" value={cur} onChange={e=>setCur(e.target.value)} /></div>
        <div className="fg"><label className="lbl">New Password</label><input type="password" value={nw} onChange={e=>setNw(e.target.value)} /></div>
        <div className="fg"><label className="lbl">Confirm New Password</label><input type="password" value={cf} onChange={e=>setCf(e.target.value)} onKeyDown={e=>e.key==="Enter"&&change()} /></div>
        {msg&&<div style={{padding:"9px 12px",borderRadius:3,marginBottom:12,background:msg.t==="e"?C.redD:C.greenD,border:`1px solid ${msg.t==="e"?"rgba(239,68,68,.3)":"rgba(34,197,94,.3)"}`,color:msg.t==="e"?C.red:C.green,fontSize:13}}>{msg.m}</div>}
        <button className="bp" onClick={change}>Update Password</button>
        <div style={{height:1,background:C.border,margin:"16px 0 14px"}} />
        <p style={{color:C.sub,fontSize:12,fontWeight:600,marginBottom:10}}>Admin Access Methods</p>
        {[["URL","yoursite.com/#admin"],["Shortcut (Windows)","Ctrl+Shift+A"],["Shortcut (Mac)","Cmd+Shift+A"]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{color:C.muted,fontSize:12}}>{l}</span>
            <code style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:C.accent}}>{v}</code>
          </div>
        ))}
      </div>
    </div>);
  }

  return null;
}

/* ════════════════════════════════════════════════════════════
   CRUD MODALS — full-screen modals for products, categories, blog, faq, qr
   ════════════════════════════════════════════════════════════ */
function CRUDModal({ type, state, dispatch }) {
  const close = () => dispatch({ type: "closeCRUD" });
  const { products, categories, blog, faq } = state;

  /* ── PRODUCTS ── */
  if (type === "products") {
    const [view,setView]=useState("list"); const [editId,setEditId]=useState(null);
    const editing=products.find(p=>p.id===editId);
    const setProducts=val=>dispatch({type:"set",key:"products",val});

    function ProdForm({ item, onSave, onCancel }) {
      const blank={id:"",name:"",sku:"",category:categories[0]?.id||"",shortDesc:"",image:"",gallery:[],pdfUrl:"",verifyCode:genCode(),specs:[{key:"",value:""}],compatible:"",featured:false};
      const [f,setF]=useState(item?{...item,gallery:[...(item.gallery||[])],specs:[...(item.specs||[]).map(s=>({...s}))]}:blank);
      const addSpec=()=>setF({...f,specs:[...f.specs,{key:"",value:""}]});
      const upSpec=(i,k,v)=>{const s=[...f.specs];s[i]={...s[i],[k]:v};setF({...f,specs:s})};
      const delSpec=i=>setF({...f,specs:f.specs.filter((_,x)=>x!==i)});
      return (<div>
        <div className="fg2">
          <div className="fg"><label className="lbl">Product Name *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
          <div className="fg"><label className="lbl">SKU *</label><input value={f.sku} onChange={e=>setF({...f,sku:e.target.value,id:e.target.value})} /></div>
          <div className="fg"><label className="lbl">Category</label><select value={f.category} onChange={e=>setF({...f,category:e.target.value})}>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
          <div className="fg" style={{display:"flex",alignItems:"center",gap:9,paddingTop:18}}><input type="checkbox" checked={f.featured} onChange={e=>setF({...f,featured:e.target.checked})} style={{width:"auto"}} id="fc"/><label htmlFor="fc" style={{color:C.sub,fontSize:12,marginBottom:0}}>Featured</label></div>
        </div>
        <div className="fg"><label className="lbl">Short Description *</label><textarea rows={2} value={f.shortDesc} onChange={e=>setF({...f,shortDesc:e.target.value})} /></div>
        <ImgInput label="Main Image *" val={f.image} set={v=>setF({...f,image:v})} small />
        <GalleryPicker images={f.gallery} onChange={g=>setF({...f,gallery:g})} />
        <PdfInput label="Product Catalog PDF" val={f.pdfUrl} set={v=>setF({...f,pdfUrl:v})} />
        <div className="fg"><label className="lbl">Compatible Models (one per line)</label><textarea rows={3} value={f.compatible} onChange={e=>setF({...f,compatible:e.target.value})} /></div>
        <div className="fg">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <label className="lbl" style={{marginBottom:0}}>Technical Specs</label>
            <button className="bo bsm" onClick={addSpec}><Ic.Plus/>Row</button>
          </div>
          {f.specs.map((s,i)=>(
            <div key={i} style={{display:"flex",gap:7,marginBottom:7,alignItems:"center"}}>
              <input value={s.key} onChange={e=>upSpec(i,"key",e.target.value)} placeholder="Key" style={{flex:1}} />
              <input value={s.value} onChange={e=>upSpec(i,"value",e.target.value)} placeholder="Value" style={{flex:1}} />
              {f.specs.length>1&&<button onClick={()=>delSpec(i)} style={{color:C.red,flexShrink:0}}><Ic.Trash/></button>}
            </div>
          ))}
        </div>
        <div style={{background:"rgba(232,96,26,.04)",border:"1px solid rgba(232,96,26,.18)",borderRadius:3,padding:"10px 12px",marginBottom:14}}>
          <label className="lbl" style={{color:C.accent}}>🔐 Verify Code</label>
          <div style={{display:"flex",gap:7}}>
            <input readOnly value={f.verifyCode||""} style={{flex:1,fontFamily:"'Space Mono',monospace",color:C.accent,background:C.bg}} />
            <button className="bo bsm" onClick={()=>setF({...f,verifyCode:genCode()})} style={{flexShrink:0}}>↻ New</button>
          </div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button className="bp" onClick={()=>{if(!f.name||!f.sku){alert("Name and SKU required");return;}onSave({...f,id:f.sku});}}>Save</button>
          <button className="bo" onClick={onCancel}>Cancel</button>
        </div>
      </div>);
    }

    return (<div className="crud-modal" onClick={close}>
      <div className="crud-inner" onClick={e=>e.stopPropagation()}>
        <div className="crud-hdr">
          <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:19,color:C.white}}>
            {view==="list"?`Products (${products.length})`:view==="add"?"Add Product":"Edit Product"}
          </h3>
          <div style={{display:"flex",gap:8}}>
            {view==="list"&&<button className="bp bsm" onClick={()=>{setView("add");setEditId(null)}}><Ic.Plus/>Add</button>}
            <button onClick={close} style={{color:C.sub}}><Ic.X/></button>
          </div>
        </div>
        <div className="crud-body">
          {view==="list"&&(
            <div style={{overflowX:"auto"}}>
              <table className="adtbl">
                <thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>PDF</th><th>★</th><th></th></tr></thead>
                <tbody>
                  {products.map(p=>(
                    <tr key={p.id}>
                      <td><div style={{display:"flex",gap:8,alignItems:"center"}}><div style={{width:32,height:32,borderRadius:2,overflow:"hidden",background:C.el,flexShrink:0}}>{p.image&&<img src={p.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} />}</div><span style={{color:C.white,fontWeight:500}}>{p.name}</span></div></td>
                      <td><span className="sku">{p.sku}</span></td>
                      <td style={{color:C.sub}}>{categories.find(c=>c.id===p.category)?.name||p.category}</td>
                      <td>{p.pdfUrl?<span className="badge-g">✓</span>:<span className="badge-m">—</span>}</td>
                      <td>{p.featured?<span style={{color:"#f59e0b"}}>★</span>:<span style={{color:C.muted}}>—</span>}</td>
                      <td><div style={{display:"flex",gap:5}}>
                        <button className="bo bsm" onClick={()=>{setEditId(p.id);setView("edit")}}><Ic.Edit/></button>
                        <button className="bo bsm bred" onClick={()=>{if(window.confirm(`Delete "${p.name}"?`))setProducts(products.filter(x=>x.id!==p.id))}}><Ic.Trash/></button>
                      </div></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {(view==="add"||view==="edit")&&(
            <ProdForm item={view==="edit"?editing:null}
              onSave={p=>{ if(view==="edit") setProducts(products.map(x=>x.id===p.id?p:x)); else setProducts([...products,p]); setView("list"); }}
              onCancel={()=>setView("list")} />
          )}
        </div>
      </div>
    </div>);
  }

  /* ── CATEGORIES ── */
  if (type === "categories") {
    const [editing,setEditing]=useState(null); const [adding,setAdding]=useState(false);
    const [newCat,setNewCat]=useState({id:"",name:"",count:0,image:"",description:""});
    const setCategories=val=>dispatch({type:"set",key:"categories",val});

    const CatForm=({f,setF,onSave,onCancel})=>(<div>
      <div className="fg2">
        <div className="fg"><label className="lbl">Name *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
        <div className="fg"><label className="lbl">Display Count</label><input type="number" value={f.count} onChange={e=>setF({...f,count:parseInt(e.target.value)||0})} /></div>
      </div>
      <div className="fg"><label className="lbl">Description</label><textarea rows={2} value={f.description} onChange={e=>setF({...f,description:e.target.value})} /></div>
      <ImgInput label="Category Image" val={f.image} set={v=>setF({...f,image:v})} small />
      <div style={{display:"flex",gap:10,marginTop:6}}><button className="bp" onClick={onSave}>Save</button><button className="bo" onClick={onCancel}>Cancel</button></div>
    </div>);

    return (<div className="crud-modal" onClick={close}>
      <div className="crud-inner" onClick={e=>e.stopPropagation()}>
        <div className="crud-hdr">
          <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:19,color:C.white}}>Categories ({categories.length})</h3>
          <div style={{display:"flex",gap:8}}>
            {!adding&&!editing&&<button className="bp bsm" onClick={()=>setAdding(true)}><Ic.Plus/>Add</button>}
            <button onClick={close} style={{color:C.sub}}><Ic.X/></button>
          </div>
        </div>
        <div className="crud-body">
          {adding&&<div style={{marginBottom:20,padding:16,background:C.el,borderRadius:4}}>
            <p style={{color:C.white,fontWeight:600,fontSize:14,marginBottom:14}}>Add New Category</p>
            <CatForm f={newCat} setF={setNewCat} onSave={()=>{
              if(!newCat.name){alert("Name required");return;}
              const id=slugify(newCat.name);
              if(categories.find(c=>c.id===id)){alert("Category already exists");return;}
              setCategories([...categories,{...newCat,id}]);
              setNewCat({id:"",name:"",count:0,image:"",description:""});setAdding(false);
            }} onCancel={()=>setAdding(false)} />
          </div>}
          {editing&&<div style={{marginBottom:20,padding:16,background:C.el,borderRadius:4}}>
            <p style={{color:C.white,fontWeight:600,fontSize:14,marginBottom:14}}>Edit: {editing.name}</p>
            <CatForm f={editing} setF={setEditing} onSave={()=>{setCategories(categories.map(c=>c.id===editing.id?editing:c));setEditing(null);}} onCancel={()=>setEditing(null)} />
          </div>}
          <table className="adtbl">
            <thead><tr><th>Category</th><th>Products</th><th></th></tr></thead>
            <tbody>
              {categories.map(cat=>(
                <tr key={cat.id}>
                  <td><div style={{display:"flex",gap:8,alignItems:"center"}}><div style={{width:34,height:34,borderRadius:2,overflow:"hidden",background:C.el,flexShrink:0}}>{cat.image&&<img src={cat.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} />}</div><span style={{color:C.white,fontWeight:500}}>{cat.name}</span></div></td>
                  <td style={{color:C.sub}}>{products.filter(p=>p.category===cat.id).length}</td>
                  <td><div style={{display:"flex",gap:5}}>
                    <button className="bo bsm" onClick={()=>{setEditing({...cat});setAdding(false)}}><Ic.Edit/></button>
                    <button className="bo bsm bred" onClick={()=>{const cnt=products.filter(p=>p.category===cat.id).length;if(cnt>0&&!window.confirm(`${cnt} product(s) in this category. Delete anyway?`))return;setCategories(categories.filter(c=>c.id!==cat.id));}}><Ic.Trash/></button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>);
  }

  /* ── BLOG ── */
  if (type === "blog") {
    const [view,setView]=useState("list"); const [editId,setEditId]=useState(null);
    const setBlog=val=>dispatch({type:"set",key:"blog",val});
    const editing=blog.find(p=>p.id===editId);
    const blank={id:Date.now(),title:"",category:"",date:new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}),readTime:"5 min",excerpt:"",image:"",content:""};

    function BlogForm({item,onSave,onCancel}) {
      const [f,setF]=useState(item||blank);
      return (<div>
        <div className="fg"><label className="lbl">Title *</label><input value={f.title} onChange={e=>setF({...f,title:e.target.value})} /></div>
        <div className="fg2">
          <div className="fg"><label className="lbl">Category</label><input value={f.category} onChange={e=>setF({...f,category:e.target.value})} placeholder="e.g. Technical" /></div>
          <div className="fg"><label className="lbl">Date</label><input value={f.date} onChange={e=>setF({...f,date:e.target.value})} /></div>
          <div className="fg"><label className="lbl">Read Time</label><input value={f.readTime} onChange={e=>setF({...f,readTime:e.target.value})} placeholder="5 min" /></div>
        </div>
        <ImgInput label="Cover Image" val={f.image} set={v=>setF({...f,image:v})} small />
        <div className="fg"><label className="lbl">Excerpt</label><textarea rows={2} value={f.excerpt} onChange={e=>setF({...f,excerpt:e.target.value})} /></div>
        <div className="fg"><label className="lbl">Full Content (blank line = new paragraph)</label><textarea rows={7} value={f.content} onChange={e=>setF({...f,content:e.target.value})} /></div>
        <div style={{display:"flex",gap:10}}><button className="bp" onClick={()=>{if(!f.title){alert("Title required");return;}onSave({...f,id:f.id||Date.now()});}}>Save</button><button className="bo" onClick={onCancel}>Cancel</button></div>
      </div>);
    }

    return (<div className="crud-modal" onClick={close}>
      <div className="crud-inner" onClick={e=>e.stopPropagation()}>
        <div className="crud-hdr">
          <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:19,color:C.white}}>
            {view==="list"?`Blog Posts (${blog.length})`:view==="add"?"New Post":"Edit Post"}
          </h3>
          <div style={{display:"flex",gap:8}}>
            {view==="list"&&<button className="bp bsm" onClick={()=>{setView("add");setEditId(null)}}><Ic.Plus/>New Post</button>}
            <button onClick={close} style={{color:C.sub}}><Ic.X/></button>
          </div>
        </div>
        <div className="crud-body">
          {view==="list"&&(blog.length===0
            ? <p style={{color:C.sub,textAlign:"center",padding:"30px 0"}}>No posts yet.</p>
            : <table className="adtbl">
                <thead><tr><th>Title</th><th>Category</th><th>Date</th><th></th></tr></thead>
                <tbody>
                  {blog.map(p=>(
                    <tr key={p.id}>
                      <td style={{color:C.white,fontWeight:500,maxWidth:240}}>{p.title}</td>
                      <td><span className="badge-m">{p.category}</span></td>
                      <td style={{color:C.sub,fontSize:11}}>{p.date}</td>
                      <td><div style={{display:"flex",gap:5}}>
                        <button className="bo bsm" onClick={()=>{setEditId(p.id);setView("edit")}}><Ic.Edit/></button>
                        <button className="bo bsm bred" onClick={()=>{if(window.confirm("Delete?"))setBlog(blog.filter(x=>x.id!==p.id))}}><Ic.Trash/></button>
                      </div></td>
                    </tr>
                  ))}
                </tbody>
              </table>
          )}
          {(view==="add"||view==="edit")&&<BlogForm item={view==="edit"?editing:null} onSave={p=>{ if(view==="edit") setBlog(blog.map(x=>x.id===p.id?p:x)); else setBlog([...blog,p]); setView("list"); }} onCancel={()=>setView("list")} />}
        </div>
      </div>
    </div>);
  }

  /* ── FAQ ── */
  if (type === "faq") {
    const [editId,setEditId]=useState(null); const [adding,setAdding]=useState(false);
    const [newF,setNewF]=useState({q:"",a:""});
    const setFaq=val=>dispatch({type:"set",key:"faq",val});
    return (<div className="crud-modal" onClick={close}>
      <div className="crud-inner" onClick={e=>e.stopPropagation()}>
        <div className="crud-hdr">
          <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:19,color:C.white}}>FAQ ({faq.length})</h3>
          <div style={{display:"flex",gap:8}}>
            {!adding&&<button className="bp bsm" onClick={()=>setAdding(true)}><Ic.Plus/>Add</button>}
            <button onClick={close} style={{color:C.sub}}><Ic.X/></button>
          </div>
        </div>
        <div className="crud-body">
          {adding&&<div style={{background:C.el,borderRadius:4,padding:16,marginBottom:16}}>
            <div className="fg"><label className="lbl">Question *</label><input value={newF.q} onChange={e=>setNewF({...newF,q:e.target.value})} /></div>
            <div className="fg"><label className="lbl">Answer *</label><textarea rows={3} value={newF.a} onChange={e=>setNewF({...newF,a:e.target.value})} /></div>
            <div style={{display:"flex",gap:10}}><button className="bp" onClick={()=>{if(!newF.q||!newF.a){alert("Both required");return;}setFaq([...faq,{...newF,id:Date.now()}]);setNewF({q:"",a:""});setAdding(false);}}>Add</button><button className="bo" onClick={()=>{setAdding(false);setNewF({q:"",a:""})}}>Cancel</button></div>
          </div>}
          {faq.map((item,i)=>(
            <div key={item.id} style={{background:C.el,borderRadius:3,padding:14,marginBottom:10}}>
              {editId===item.id?(
                <div>
                  <div className="fg"><label className="lbl">Question</label><input value={item.q} onChange={e=>setFaq(faq.map(x=>x.id===item.id?{...x,q:e.target.value}:x))} /></div>
                  <div className="fg"><label className="lbl">Answer</label><textarea rows={3} value={item.a} onChange={e=>setFaq(faq.map(x=>x.id===item.id?{...x,a:e.target.value}:x))} /></div>
                  <button className="bp bsm" onClick={()=>setEditId(null)}>✓ Done</button>
                </div>
              ):(
                <div style={{display:"flex",justifyContent:"space-between",gap:14,alignItems:"flex-start"}}>
                  <div>
                    <p style={{color:C.white,fontWeight:500,fontSize:13,marginBottom:4}}>{i+1}. {item.q}</p>
                    <p style={{color:C.sub,fontSize:12,lineHeight:1.6}}>{item.a.slice(0,80)}…</p>
                  </div>
                  <div style={{display:"flex",gap:5,flexShrink:0}}>
                    <button className="bo bsm" onClick={()=>setEditId(item.id)}><Ic.Edit/></button>
                    <button className="bo bsm bred" onClick={()=>{if(window.confirm("Delete?"))setFaq(faq.filter(x=>x.id!==item.id))}}><Ic.Trash/></button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>);
  }

  /* ── QR CODES ── */
  if (type === "qr") {
    const [domain,setDomain]=useState("https://yoursite.com");
    const [copied,setCopied]=useState(null);
    const copy=code=>{navigator.clipboard?.writeText(`${domain}/#verify/${code}`);setCopied(code);setTimeout(()=>setCopied(null),2000);};
    return (<div className="crud-modal" onClick={close}>
      <div className="crud-inner" onClick={e=>e.stopPropagation()} style={{maxWidth:900}}>
        <div className="crud-hdr">
          <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:19,color:C.white}}>🔐 QR Verification Codes</h3>
          <button onClick={close} style={{color:C.sub}}><Ic.X/></button>
        </div>
        <div className="crud-body">
          <div style={{background:"rgba(232,96,26,.05)",border:"1px solid rgba(232,96,26,.2)",borderRadius:4,padding:14,marginBottom:18}}>
            <p style={{color:C.sub,fontSize:13,marginBottom:10}}>Print QR codes on product packaging. Customers scan to verify authenticity.</p>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>

        </div>

      {adminMode&&<div style={{background:"rgba(232,96,26,.08)",border:"1px solid rgba(232,96,26,.2)",padding:"10px 24px",textAlign:"center",fontSize:12,color:C.sub}}>
        To add/edit/delete blog posts → click <strong style={{color:C.accent}}>✍ Blog</strong> in the orange top bar
      </div>}
      <div className="mw sp">
        {blog.length===0
          ? <div style={{textAlign:"center",padding:"80px 0",color:C.sub}}><p>No blog posts yet. Add posts from the top bar.</p></div>
          : <>
            <div className="gfeat ch" onClick={()=>setPost(blog[0])} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,overflow:"hidden",cursor:"pointer",marginBottom:24}} onMouseEnter={e=>e.currentTarget.style.borderColor="rgba(232,96,26,.38)"} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
              <div style={{minHeight:250,overflow:"hidden"}}>{blog[0].image&&<img src={blog[0].image} alt={blog[0].title} style={{width:"100%",height:"100%",objectFit:"cover",minHeight:250}} />}</div>

                <h2 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"clamp(17px,2.5vw,22px)",color:C.white,lineHeight:1.25,marginBottom:12}}>{blog[0].title}</h2>
                <p style={{color:C.sub,fontSize:13,lineHeight:1.7,marginBottom:18}}>{blog[0].excerpt}</p>

              </div>
            </div>
            <div className="gblog">

                <div key={p.id} className="ch" onClick={()=>setPost(p)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,overflow:"hidden",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.borderColor="rgba(232,96,26,.38)"} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{height:178,overflow:"hidden"}}>{p.image&&<img src={p.image} alt={p.title} style={{width:"100%",height:"100%",objectFit:"cover"}} />}</div>
                  <div style={{padding:"17px 17px"}}>
                    <div style={{display:"flex",gap:8,marginBottom:9}}><span className="sku">{p.category}</span><span style={{color:C.muted,fontSize:10,fontFamily:"'Space Mono',monospace"}}>{p.date}</span></div>
                    <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:600,fontSize:16,color:C.white,lineHeight:1.3,marginBottom:8}}>{p.title}</h3>
                    <p style={{color:C.sub,fontSize:12,lineHeight:1.65,marginBottom:12}}>{p.excerpt?.slice(0,90)}…</p>
                    <div style={{color:C.accent,fontSize:12,display:"flex",alignItems:"center",gap:5,fontWeight:500}}>Read Article <Ic.Arrow/></div>
                  </div>

              ))}
            </div>
          </>}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   PAGE: PRODUCT AUTHENTICITY VERIFICATION
   ════════════════════════════════════════════════════════════ */
function PageVerify({ code, onExit }) {
  const { brand, header, products, verify, adminMode, setPanel } = useApp();
  const product=products.find(p=>(p.verifyCode||p.sku)===code);
  const valid=!!product;
  const timestamp=new Date().toLocaleString("en-US",{dateStyle:"long",timeStyle:"short"});
  const br=s=>(s||"").replace(/\[brand\]/g,brand.name);

  return (
    <div style={{minHeight:"100vh",background:"#050607",display:"flex",flexDirection:"column"}}>
      <div style={{borderBottom:`1px solid ${C.border}`,padding:"0 24px",display:"flex",alignItems:"center",height:56,background:"rgba(5,6,7,.95)",backdropFilter:"blur(12px)",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:9,flex:1}}>
          {header.logo
            ? <img src={header.logo} alt={header.logoText} style={{height:28,objectFit:"contain"}} />
            : <><div style={{width:26,height:26,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center",clipPath:"polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)"}}><span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:12,color:"#fff"}}>{(header.logoText||"A")[0]}</span></div>
               <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:15,color:C.white,letterSpacing:3}}>{header.logoText}</span></>}
        </div>
        <div style={{flex:1,display:"flex",justifyContent:"flex-end",gap:8}}>
          {adminMode&&<button className="edit-btn" style={{position:"static"}} onClick={()=>setPanel("verify")}>✏ VERIFY PAGE TEXT</button>}
          <button onClick={onExit} className="bo bsm">← Back to Site</button>
        </div>
      </div>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"48px 20px"}}>
        {valid?(
          <div style={{maxWidth:600,width:"100%",textAlign:"center"}} className="fu">
            <div style={{width:100,height:100,borderRadius:"50%",background:"rgba(34,197,94,.08)",border:"2px solid rgba(34,197,94,.35)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 28px",boxShadow:"0 0 48px rgba(34,197,94,.12)"}}>
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2" strokeLinecap="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(34,197,94,.08)",border:"1px solid rgba(34,197,94,.3)",borderRadius:3,padding:"6px 18px",marginBottom:22}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="#22c55e"><path d="M20 6L9 17l-5-5"/></svg>
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#22c55e",letterSpacing:2.5,textTransform:"uppercase"}}>{verify.successBadge}</span>
            </div>
            <h1 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"clamp(26px,4vw,40px)",color:C.white,lineHeight:1.15,marginBottom:12}}>{verify.successHeadline}</h1>
            <p style={{fontSize:16,color:C.text,marginBottom:10,fontWeight:500}}>{br(verify.successSubline)}</p>
            <p style={{color:C.sub,fontSize:14,lineHeight:1.75,maxWidth:460,margin:"0 auto 36px"}}>{br(verify.successMessage)}</p>
            <div style={{background:C.card,border:"1px solid rgba(34,197,94,.2)",borderRadius:6,padding:24,marginBottom:32,textAlign:"left"}}>
              <div style={{display:"flex",gap:16,alignItems:"center",marginBottom:20,paddingBottom:20,borderBottom:`1px solid ${C.border}`}}>
                <div style={{width:76,height:76,borderRadius:5,overflow:"hidden",background:C.el,flexShrink:0,border:`1px solid ${C.border}`}}>
                  {product.image&&<img src={product.image} alt={product.name} style={{width:"100%",height:"100%",objectFit:"cover"}} />}
                </div>
                <div>
                  <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:20,color:C.white,marginBottom:6}}>{product.name}</h3>
                  <span className="sku">{product.sku}</span>
                </div>
                <div style={{marginLeft:"auto",background:"rgba(34,197,94,.1)",border:"1px solid rgba(34,197,94,.3)",borderRadius:3,padding:"8px 14px"}}>
                  <p style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#22c55e",letterSpacing:2,textTransform:"uppercase"}}>AUTHENTIC</p>
                </div>
              </div>
              {[["Verification ID",code,true],["Product SKU",product.sku,true],["Manufacturer",brand.name,false],["Verified On",timestamp,false],["Status","✓ Genuine Original",false]].map(([l,v,mono])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${C.border}`,gap:16}}>
                  <span style={{color:C.sub,fontSize:12,flexShrink:0}}>{l}</span>
                  <span style={{color:l==="Status"?"#22c55e":C.text,fontSize:mono?11:13,fontFamily:mono?"'Space Mono',monospace":"inherit",fontWeight:mono?700:400,textAlign:"right"}}>{v}</span>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
              <button className="bp" onClick={onExit} style={{padding:"13px 28px"}}>{verify.successCTA} <Ic.Arrow/></button>
              <button className="bo" onClick={onExit}>Back to Home</button>
            </div>
          </div>
        ):(
          <div style={{maxWidth:520,width:"100%",textAlign:"center"}} className="fu">
            <div style={{width:100,height:100,borderRadius:"50%",background:"rgba(239,68,68,.08)",border:"2px solid rgba(239,68,68,.3)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 28px",boxShadow:"0 0 48px rgba(239,68,68,.08)"}}>
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
            </div>
            <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(239,68,68,.08)",border:"1px solid rgba(239,68,68,.25)",borderRadius:3,padding:"6px 18px",marginBottom:22}}>
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#ef4444",letterSpacing:2.5,textTransform:"uppercase"}}>{verify.failBadge}</span>
            </div>
            <h1 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"clamp(24px,4vw,36px)",color:C.white,lineHeight:1.15,marginBottom:14}}>{verify.failHeadline}</h1>
            <p style={{color:C.sub,fontSize:15,lineHeight:1.75,maxWidth:420,margin:"0 auto 16px"}}>{verify.failMessage}</p>
            <p style={{color:C.sub,fontSize:14,lineHeight:1.75,maxWidth:400,margin:"0 auto 32px"}}>{verify.failWarning}</p>
            <div style={{background:C.card,border:"1px solid rgba(239,68,68,.2)",borderRadius:4,padding:"14px 20px",marginBottom:32,display:"inline-block"}}>
              <p style={{color:C.muted,fontSize:10,fontFamily:"'Space Mono',monospace",letterSpacing:2,marginBottom:4}}>CODE ATTEMPTED</p>
              <p style={{color:"#ef4444",fontFamily:"'Space Mono',monospace",fontSize:14,fontWeight:700}}>{code||"—"}</p>
            </div>
            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
              <button className="bp bred" onClick={onExit} style={{padding:"13px 28px"}}>{verify.failCTA}</button>
              <button className="bo" onClick={onExit}>Back to Home</button>
            </div>
            <p style={{color:C.muted,fontSize:12,marginTop:24,lineHeight:1.7}}>{brand.name} uses unique digital codes on every genuine product.<br/>Concerns? Email <span style={{color:C.accent}}>{brand.email}</span></p>
          </div>
        )}
      </div>
      <div style={{borderTop:`1px solid ${C.border}`,padding:"14px 24px",textAlign:"center"}}>
        <p style={{color:C.muted,fontSize:11}}>{brand.name} Authenticity System · {brand.email} · {new Date().getFullYear()}</p>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════
   INQUIRIES PANEL (full screen modal)
   ════════════════════════════════════════════════════════════ */
function InquiriesPanel({ inquiries, onClose }) {
  const [sel,setSel]=useState(null);
  return (<div className="crud-modal" onClick={onClose}>
    <div className="crud-inner" style={{maxWidth:700}} onClick={e=>e.stopPropagation()}>
      <div className="crud-hdr">
        <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:19,color:C.white}}>Inquiries ({inquiries.length})</h3>
        <button onClick={onClose} style={{color:C.sub}}><Ic.X/></button>
      </div>
      <div className="crud-body">
        {sel?(
          <div>
            <button className="bo bsm" onClick={()=>setSel(null)} style={{marginBottom:16}}>← Back</button>
            {[["Name",sel.name],["Email",sel.email],["Phone",sel.phone||"—"],["Company",sel.company||"—"],["Time",sel.time]].map(([l,v])=>(
              <div key={l} style={{display:"flex",gap:16,padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                <span style={{color:C.muted,fontSize:12,width:70,flexShrink:0}}>{l}</span>
                <span style={{color:C.text,fontSize:13}}>{v}</span>
              </div>
            ))}
            <div style={{padding:"14px 0"}}><p style={{color:C.muted,fontSize:12,marginBottom:8}}>Message:</p><p style={{color:C.text,fontSize:14,lineHeight:1.75,whiteSpace:"pre-wrap"}}>{sel.message}</p></div>
          </div>
        ):inquiries.length===0
          ? <p style={{color:C.sub,textAlign:"center",padding:"30px 0"}}>No inquiries yet.</p>
          : <table className="adtbl">
              <thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Time</th><th></th></tr></thead>
              <tbody>
                {[...inquiries].reverse().map((inq,i)=>(
                  <tr key={i}>
                    <td style={{color:C.white,fontWeight:500}}>{inq.name}</td>
                    <td style={{color:C.sub}}>{inq.email}</td>
                    <td style={{color:C.sub}}>{inq.company||"—"}</td>
                    <td style={{color:C.muted,fontSize:10,fontFamily:"'Space Mono',monospace"}}>{inq.time}</td>
                    <td><button className="bo bsm" onClick={()=>setSel(inq)}>View</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
        }
      </div>
    </div>
  </div>);
}

/* ════════════════════════════════════════════════════════════
   MAIN APP — root component with all state
   ════════════════════════════════════════════════════════════ */
function App() {
  const [page,     setPage]     = useState("home");
  const [selCat,   setSelCat]   = useState(null);
  const [selProd,  setSelProd]  = useState(null);
  const [selPost,  setSelPost]  = useState(null);
  const [verifyMode,setVerifyMode]=useState(false);
  const [verifyCode,setVerifyCode]=useState("");
  const [adminMode, setAdminMode]=useState(false);
  const [showLogin, setShowLogin]=useState(false);
  const [panel,    setPanel]    = useState(null);
  const [crud,     setCrud]     = useState(null);
  const [showInq,  setShowInq]  = useState(false);

  // ── All CMS state ──
  const [brand,    setBrand]    = useState(INIT.brand);
  const [header,   setHeader]   = useState(INIT.header);
  const [hero,     setHero]     = useState(INIT.hero);
  const [trust,    setTrust]    = useState(INIT.trust);
  const [catSection,setCatSection]=useState(INIT.catSection);
  const [featSection,setFeatSection]=useState(INIT.featSection);
  const [why,      setWhy]      = useState(INIT.why);
  const [cta,      setCta]      = useState(INIT.cta);
  const [blogSection,setBlogSection]=useState(INIT.blogSection);
  const [footer,   setFooter]   = useState(INIT.footer);
  const [about,    setAbout]    = useState(INIT.about);
  const [verify,   setVerify]   = useState(INIT.verify);
  const [seo,      setSeo]      = useState(INIT.seo);
  const [products, setProducts] = useState(INIT.products);
  const [categories,setCategories]=useState(INIT.categories);
  const [blog,     setBlog]     = useState(INIT.blog);
  const [faq,      setFaq]      = useState(INIT.faq);
  const [inquiries,setInquiries]=useState([]);
  const [adminPw,  setAdminPw]  = useState(INIT_PW);

  // ── Dispatch for edit panels ──
  const dispatch = ({ type, key, val }) => {
    if (type === "closePanel") { setPanel(null); return; }
    if (type === "closeCRUD")  { setCrud(null);  return; }
    if (type === "set") {
      const map = {
        brand:setBrand, header:setHeader, hero:setHero, trust:setTrust,
        catSection:setCatSection, featSection:setFeatSection,
        why:setWhy, cta:setCta, blogSection:setBlogSection,
        footer:setFooter, about:setAbout, verify:setVerify, seo:setSeo,
        products:setProducts, categories:setCategories,
        blog:setBlog, faq:setFaq, adminPw:setAdminPw,
      };
      if (map[key]) map[key](val);
    }
  };

  // ── Context value ──
  const ctxVal = {
    brand, header, hero, trust, catSection, featSection, why, cta, blogSection,
    footer, about, verify, seo, products, categories, blog, faq,
    adminMode, setPanel, setCrud,
  };

  // ── Hidden admin access ──
  useEffect(()=>{
    const checkHash=()=>{
      const hash=window.location.hash;
      if(hash==="#admin"&&!adminMode){ window.history.replaceState(null,"",window.location.pathname+window.location.search); setShowLogin(true); return; }
      if(hash.startsWith("#verify/")){ const code=hash.replace("#verify/","").trim(); window.history.replaceState(null,"",window.location.pathname+window.location.search); if(code){setVerifyCode(code);setVerifyMode(true);} return; }
    };
    checkHash();
    window.addEventListener("hashchange",checkHash);
    const onKey=e=>{ if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==="A"){e.preventDefault();if(!adminMode)setShowLogin(true);} };
    window.addEventListener("keydown",onKey);
    return()=>{ window.removeEventListener("hashchange",checkHash); window.removeEventListener("keydown",onKey); };
  },[adminMode]);

  const nav=(p,extra={})=>{
    setVerifyMode(false);
    setPage(p);
    if(extra.cat!==undefined)     setSelCat(extra.cat);
    if(extra.product!==undefined) setSelProd(extra.product);
    if(extra.post!==undefined)    setSelPost(extra.post);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  // ── Export function (works on live hosted website) ──
  const exportSite = async () => {
    const state = { brand, header, hero, trust, catSection, featSection, why, cta, blogSection, footer, about, verify, seo, categories, products, blog, faq };
    try {
      const res = await fetch(window.location.href);
      let html  = await res.text();
      const newInit =
        `const INIT = ${JSON.stringify(Object.assign({}, state, { products, categories, blog, faq }), null, 0)};\nconst INIT_PW = ${JSON.stringify(adminPw)};`;
      html = html.replace(/const INIT = \{[\s\S]*?;\s*\nconst INIT_PW = "[^"]*";/, newInit);
      const blob = new Blob([html],{type:"text/html"});
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = "index.html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
      alert("✓ New index.html downloaded! Upload it to your hosting to save all changes permanently.");
    } catch {
      alert("💡 Export works on your live website (Hostinger, Netlify, etc.).\n\nIn this preview, changes are session-only.\n\nDeploy the ZIP file first, then use Save & Export from your live site.");
    }
  };

  // ── Verify page ──
  if (verifyMode) return (
    <Ctx.Provider value={ctxVal}>
      <GS/>
      {showLogin&&<AdminLogin onSuccess={()=>{setShowLogin(false);setAdminMode(true);}} onClose={()=>setShowLogin(false)} adminPw={adminPw}/>}
      {adminMode&&<AdminBar onExit={()=>{setAdminMode(false);setPanel(null);}} onExport={exportSite} onOpenCRUD={t=>setCrud(t)} onOpenSecurity={()=>setPanel("security")} />}
      {panel && <><div onClick={()=>setPanel(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:9990}}/><EditPanel panelId={panel} state={{brand,header,hero,trust,catSection,featSection,why,cta,blogSection,footer,about,verify,seo,adminPw}} dispatch={dispatch} /></>}
      {crud && <CRUDModal type={crud} state={{products,categories,blog,faq}} dispatch={dispatch} />}
      <PageVerify code={verifyCode} onExit={()=>{setVerifyMode(false);nav("home");}} />
    </Ctx.Provider>
  );

  return (
    <Ctx.Provider value={ctxVal}>
      <GS/>
      {showLogin&&<AdminLogin onSuccess={()=>{setShowLogin(false);setAdminMode(true);}} onClose={()=>setShowLogin(false)} adminPw={adminPw}/>}
      {adminMode&&<AdminBar onExit={()=>{setAdminMode(false);setPanel(null);}} onExport={exportSite} onOpenCRUD={t=>setCrud(t)} onOpenSecurity={()=>setPanel("security")} />}
      {/* Edit panel backdrop + panel */}
      {panel&&<><div onClick={()=>setPanel(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:9990}} /><EditPanel panelId={panel} state={{brand,header,hero,trust,catSection,featSection,why,cta,blogSection,footer,about,verify,seo,adminPw}} dispatch={dispatch} /></>}
      {/* CRUD modals */}
      {crud&&<CRUDModal type={crud} state={{products,categories,blog,faq}} dispatch={dispatch}/>}
      {showInq&&<InquiriesPanel inquiries={inquiries} onClose={()=>setShowInq(false)}/>}

      <SiteHeader nav={nav} page={page}/>
      <main>
        {page==="home"       && <PageHome       nav={nav}/>}
        {page==="categories" && <PageCats       nav={nav}/>}
        {page==="products"   && <PageProdList   nav={nav} cat={selCat}/>}
        {page==="product"    && <PageProdDetail nav={nav} productId={selProd}/>}
        {page==="about"      && <PageAbout      nav={nav}/>}
        {page==="contact"    && <PageContact    addInquiry={inq=>{setInquiries([...inquiries,inq]);}} />}
        {page==="faq"        && <PageFAQ/>}
        {page==="blog"       && <PageBlog       nav={nav} postId={selPost}/>}
      </main>
      <SiteFooter nav={nav}/>

      {/* Inquiries button (only in admin mode) */}
      {adminMode&&(
        <button onClick={()=>setShowInq(true)} style={{position:"fixed",bottom:20,right:20,background:C.accent,color:"#fff",padding:"10px 18px",borderRadius:3,border:"none",cursor:"pointer",fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1.5,zIndex:980,boxShadow:"0 4px 20px rgba(232,96,26,.4)",display:"flex",alignItems:"center",gap:7}}>
          📬 INQUIRIES {inquiries.length>0&&`(${inquiries.length})`}
        </button>
      )}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
setTimeout(()=>{const l=document.getElementById('loading');if(l)l.style.display='none';},200);
  </script>
</body>
</html>
