      .lbl{display:block;color:#8a8a93;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600}

/* Gallery: main image + multiple extras */
function GalleryInput({ images=[], setImages }) {
  const [url, setUrl] = useState("");

    <div className="fg">

          <Ic.Plus /> Add
          <input type="file" accept="image/*" hidden multiple onChange={e=>{ [...e.target.files].forEach(f=>readFile(f,add)); }} />
        </label>
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <input placeholder="Or paste URL and press Enter" value={url} onChange={e=>setUrl(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&url){ add(url); setUrl(""); } }} />

    </div>

/* ─── ADMIN PANEL ─────────────────────────────────────────── */
/*
   🔒 SECURITY:
   • No public link in footer or anywhere on the website
   • Access ONLY via keyboard shortcut: Ctrl + Shift + A
   • Max 3 login attempts → 30-second lockout
   • Session is memory-only (auto-logout on page reload)
*/
function AdminLogin({ onSuccess, onClose }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [attempts, setAttempts] = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const [countdown, setCountdown] = useState(0);

  useEffect(() => {
    if (lockUntil <= 0) return;
    const t = setInterval(() => {
      const rem = Math.ceil((lockUntil - Date.now()) / 1000);
      if (rem <= 0) { setLockUntil(0); setCountdown(0); setAttempts(0); setErr(""); clearInterval(t); }
      else setCountdown(rem);
    }, 500);
    return () => clearInterval(t);
  }, [lockUntil]);

  const login = () => {
    if (Date.now() < lockUntil) { setErr(`Locked. Try again in ${countdown}s`); return; }
    if (pw === "automor2024") { onSuccess(); }
    else {
      const na = attempts + 1;
      setAttempts(na);
      if (na >= 3) { const t = Date.now() + 30000; setLockUntil(t); setErr("Too many attempts. Locked for 30 seconds."); }
      else setErr(`Incorrect password. ${3 - na} attempt(s) remaining.`);
    }
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", backdropFilter:"blur(8px)", zIndex:9998, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div className="fu adcard" style={{ maxWidth:380, width:"100%", padding:"36px 32px" }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
          <div style={{ width:38, height:38, background:C.accent, borderRadius:3, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff" }}><Ic.Lock /></div>
          <div>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:18, color:C.white }}>Admin Access</div>
            <div style={{ color:C.muted, fontSize:11 }}>AUTOMOR Content Management System</div>
          </div>
        </div>
        <div style={{ background:C.accentD, border:"1px solid rgba(232,96,26,0.2)", borderRadius:3, padding:"10px 14px", margin:"20px 0 20px", fontSize:12, color:C.sub }}>
          🔒 Restricted area. Authorised personnel only.
        </div>
        <label className="lbl">Password</label>
        <input type="password" placeholder="Enter admin password…" value={pw} style={{ width:"100%", marginBottom:6 }} onChange={e=>{setPw(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&login()} autoFocus />
        {err && <p style={{ color:C.red, fontSize:12, marginBottom:8 }}>{err}{countdown>0&&` (${countdown}s)`}</p>}
        <button className="bp bfull" style={{ marginTop:10 }} onClick={login} disabled={Date.now()<lockUntil}>
          {Date.now()<lockUntil ? `Locked (${countdown}s)` : "Sign In"}
        </button>

              <div className="fg"><label className="lbl">Description</label><textarea rows={2} value={editCat.description} onChange={e=>setEditCat({...editCat,description:e.target.value})} style={{width:"100%"}} /></div>
              <ImgInput label="Category Card Image" val={editCat.image} set={v=>setEditCat({...editCat,image:v})} />
              <div style={{ display:"flex", gap:10, marginTop:6 }}>
                <button className="bp" onClick={()=>{setCategories(categories.map(c=>c.id===editCat.id?editCat:c));setEditCat(null);}}>Save Category</button>
                <button className="bo" onClick={()=>setEditCat(null)}>Cancel</button>
              </div>
            </div>
          )}
          <div style={{ overflowX:"auto" }}>
            <table className="adtbl">
              <thead><tr><th>Category</th><th>ID</th><th>Products</th><th>Actions</th></tr></thead>
              <tbody>
                {categories.map(cat=>(
                  <tr key={cat.id}>
                    <td><div style={{ display:"flex", gap:9, alignItems:"center" }}><div style={{ width:40, height:40, borderRadius:3, overflow:"hidden", background:C.el, flexShrink:0 }}><img src={cat.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /></div><span style={{ color:C.white, fontWeight:500 }}>{cat.name}</span></div></td>
                    <td><span className="sku">{cat.id}</span></td>
                    <td style={{ color:C.sub }}>{products.filter(p=>p.category===cat.id).length}</td>
                    <td><button className="bo bsm" onClick={()=>setEditCat({...cat})}><Ic.Edit /> Edit</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    /* QR & VERIFY CODES */
    if (tab==="qrcodes") {
      const [domain, setDomain] = useState("https://yoursite.com");
      const [copied, setCopied] = useState(null);
      const copyUrl = (code) => {
        navigator.clipboard?.writeText(`${domain}/#verify/${code}`);
        setCopied(code); setTimeout(()=>setCopied(null),2000);
      };
      return (
        <div>
          <Hdr title={`Authenticity QR Codes (${products.length} products)`} />
          <div className="adcard" style={{ marginBottom:16, background:"rgba(232,96,26,0.05)", border:"1px solid rgba(232,96,26,0.2)" }}>
            <p style={{ color:C.sub, fontSize:13, lineHeight:1.7, marginBottom:12 }}>
              Each product has a unique QR code. Print it on the product packaging.
              When a customer scans it, they see the <strong style={{color:C.white}}>Product Authenticity Verification</strong> page — confirming the product is genuine.
            </p>
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              <label className="lbl" style={{ marginBottom:0, flexShrink:0 }}>Your Domain:</label>
              <input value={domain} onChange={e=>setDomain(e.target.value)} placeholder="https://yoursite.com" style={{ flex:1, maxWidth:320 }} />
            </div>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))", gap:16 }}>
            {products.map(p => (
              <div key={p.id} className="adcard" style={{ display:"flex", flexDirection:"column", gap:0 }}>
                {/* Product header */}
                <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:14, paddingBottom:14, borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ width:42, height:42, borderRadius:3, overflow:"hidden", background:C.el, flexShrink:0 }}>
                    <img src={p.image} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
                  </div>
                  <div>
                    <p style={{ color:C.white, fontWeight:600, fontSize:13, lineHeight:1.3 }}>{p.name}</p>
                    <span className="sku">{p.sku}</span>
                  </div>
                </div>
                {/* QR Code image */}
                <div style={{ background:"#ffffff", borderRadius:4, padding:12, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:12 }}>
                  <img
                    src={qrImgUrl(p.verifyCode||p.sku, 180)}
                    alt="QR Code"
                    style={{ width:180, height:180, display:"block" }}
                    onError={e=>{ e.target.style.display="none"; e.target.nextSibling.style.display="flex"; }}
                  />
                  <div style={{ display:"none", width:180, height:180, alignItems:"center", justifyContent:"center", color:C.muted, fontSize:12, flexDirection:"column", gap:8 }}>
                    <Ic.Key /><span>QR loads on live site</span>
                  </div>
                </div>
                {/* Verify code */}
                <div style={{ background:C.bg, border:`1px solid ${C.border}`, borderRadius:3, padding:"8px 10px", marginBottom:10 }}>
                  <p style={{ color:C.muted, fontSize:9, fontFamily:"'Space Mono',monospace", letterSpacing:1.5, textTransform:"uppercase", marginBottom:4 }}>Verification Code</p>
                  <p style={{ color:C.accent, fontFamily:"'Space Mono',monospace", fontSize:13, fontWeight:700, letterSpacing:1 }}>{p.verifyCode||p.sku}</p>
                </div>
                {/* URL */}
                <div style={{ background:C.bg, border:`1px solid ${C.border}`, borderRadius:3, padding:"8px 10px", marginBottom:12, wordBreak:"break-all", fontSize:11, fontFamily:"'Space Mono',monospace", color:C.sub }}>
                  {domain}/#verify/<span style={{ color:C.accent }}>{p.verifyCode||p.sku}</span>
                </div>
                {/* Actions */}
                <div style={{ display:"flex", gap:8 }}>
                  <button className={`bo bsm${copied===p.verifyCode?" bgrn":""}`} style={{ flex:1 }} onClick={()=>copyUrl(p.verifyCode||p.sku)}>
                    {copied===p.verifyCode?"✓ Copied!":"Copy URL"}
                  </button>
                  <a
                    href={qrImgUrl(p.verifyCode||p.sku, 600)}
                    download={`QR-${p.sku}.png`}
                    target="_blank"
                    className="bo bsm"
                    style={{ display:"inline-flex", alignItems:"center", gap:5 }}
                  >
                    <Ic.Down /> Download
                  </a>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* BLOG */
    if (tab==="blog") return (
      <div>
        <Hdr title={`Blog Posts (${blog.length})`} action={<button className="bp bsm" onClick={()=>{setShowForm(!showForm);setEditItem(null);}}><Ic.Plus /> New Post</button>} />
        {showForm && <BlogForm item={editItem} onSave={p=>{ if(editItem) setBlog(blog.map(x=>x.id===p.id?p:x)); else setBlog([...blog,p]); setShowForm(false); setEditItem(null); }} onCancel={()=>{setShowForm(false);setEditItem(null);}} />}
        <div style={{ overflowX:"auto" }}>
          <table className="adtbl">
            <thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody>
              {blog.map(post=>(
                <tr key={post.id}>
                  <td style={{ color:C.white, fontWeight:500, maxWidth:280 }}>{post.title}</td>
                  <td><span className="bgray">{post.category}</span></td>
                  <td style={{ color:C.sub, fontFamily:"'Space Mono',monospace", fontSize:11 }}>{post.date}</td>
                  <td>
                    <div style={{ display:"flex", gap:5 }}>
                      <button className="bo bsm" onClick={()=>{setEditItem(post);setShowForm(true);}}><Ic.Edit /></button>
                      <button className="bo bsm bred" onClick={()=>{if(window.confirm("Delete?"))setBlog(blog.filter(x=>x.id!==post.id));}}><Ic.Trash /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );

    /* FAQ */
    if (tab==="faq") {
      const [ef, setEf] = useState(null);
      const [newF, setNewF] = useState(false);
      const [nf, setNf] = useState({id:Date.now(),q:"",a:""});
      return (
        <div>
          <Hdr title={`FAQ (${faq.length})`} action={<button className="bp bsm" onClick={()=>setNewF(!newF)}><Ic.Plus /> Add FAQ</button>} />
          {newF && (
            <div className="adcard fu" style={{ marginBottom:14 }}>
              <div className="fg"><label className="lbl">Question *</label><input value={nf.q} onChange={e=>setNf({...nf,q:e.target.value})} style={{width:"100%"}} /></div>
              <div className="fg"><label className="lbl">Answer *</label><textarea rows={4} value={nf.a} onChange={e=>setNf({...nf,a:e.target.value})} style={{width:"100%"}} /></div>
              <div style={{ display:"flex", gap:10 }}>
                <button className="bp" onClick={()=>{setFaq([...faq,{...nf,id:Date.now()}]);setNf({id:Date.now(),q:"",a:""});setNewF(false);}}>Add FAQ</button>
                <button className="bo" onClick={()=>setNewF(false)}>Cancel</button>
              </div>
            </div>
          )}
          {faq.map((item,i)=>(
            <div key={item.id} className="adcard fu" style={{ marginBottom:10 }}>
              {ef===item.id ? (
                <div>
                  <div className="fg"><label className="lbl">Question</label><input value={item.q} onChange={e=>setFaq(faq.map(x=>x.id===item.id?{...x,q:e.target.value}:x))} style={{width:"100%"}} /></div>
                  <div className="fg"><label className="lbl">Answer</label><textarea rows={3} value={item.a} onChange={e=>setFaq(faq.map(x=>x.id===item.id?{...x,a:e.target.value}:x))} style={{width:"100%"}} /></div>
                  <button className="bp bsm" onClick={()=>setEf(null)}>Done</button>
                </div>
              ) : (
                <div style={{ display:"flex", justifyContent:"space-between", gap:16, alignItems:"flex-start" }}>
                  <div>
                    <p style={{ color:C.white, fontWeight:500, fontSize:14, marginBottom:6 }}>{i+1}. {item.q}</p>
                    <p style={{ color:C.sub, fontSize:13, lineHeight:1.6 }}>{item.a.slice(0,100)}…</p>
                  </div>
                  <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                    <button className="bo bsm" onClick={()=>setEf(item.id)}><Ic.Edit /></button>
                    <button className="bo bsm bred" onClick={()=>{if(window.confirm("Delete?"))setFaq(faq.filter(x=>x.id!==item.id));}}><Ic.Trash /></button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    /* FOOTER */
    if (tab==="footer") {
      const [f, setF] = useState(JSON.parse(JSON.stringify(footer)));
      const [saved, setSaved] = useState(false);
      const save = () => { setFooter(f); setSaved(true); setTimeout(()=>setSaved(false),2000); };
      const upLink = (i,k,v) => { const l=[...f.col3Links]; l[i]={...l[i],[k]:v}; setF({...f,col3Links:l}); };
      return (
        <div>
          <Hdr title="Footer Settings" action={<SaveBtn onSave={save} saved={saved} />} />
          <div className="adcard" style={{ marginBottom:14 }}>
            <div className="fg"><label className="lbl">Company Tagline</label><textarea rows={2} value={f.tagline} onChange={e=>setF({...f,tagline:e.target.value})} style={{width:"100%"}} /></div>
            <div className="fgrid">
              <div className="fg"><label className="lbl">Copyright Text</label><input value={f.copyright} onChange={e=>setF({...f,copyright:e.target.value})} style={{width:"100%"}} /></div>
              <div className="fg"><label className="lbl">Certification Text</label><input value={f.certText} onChange={e=>setF({...f,certText:e.target.value})} style={{width:"100%"}} /></div>
            </div>
          </div>
          <div className="adcard">
            <h3 style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:15, color:C.white, marginBottom:14 }}>Company Menu Links</h3>
            {f.col3Links.map((l,i)=>(
              <div key={l.id} style={{ display:"flex", gap:8, marginBottom:10, alignItems:"center" }}>
                <input value={l.label} onChange={e=>upLink(i,"label",e.target.value)} placeholder="Label" style={{flex:1}} />
                <input value={l.page} onChange={e=>upLink(i,"page",e.target.value)} placeholder="page key" style={{flex:1}} />
                <button onClick={()=>setF({...f,col3Links:f.col3Links.filter((_,x)=>x!==i)})} style={{color:C.red}}><Ic.Trash /></button>
              </div>
            ))}
            <button className="bo bsm" onClick={()=>setF({...f,col3Links:[...f.col3Links,{id:Date.now(),label:"",page:""}]})}><Ic.Plus /> Add Link</button>
          </div>
          <div style={{marginTop:14}}><SaveBtn onSave={save} saved={saved} /></div>
        </div>
      );
    }

    /* SEO SETTINGS */
    if (tab==="seo") {
      const [f, setF] = useState({...seo});
      const [saved, setSaved] = useState(false);
      const save = () => { setSeo(f); setSaved(true); setTimeout(()=>setSaved(false),2000); };
      return (
        <div>
          <Hdr title="SEO Settings" action={<SaveBtn onSave={save} saved={saved} />} />
          <div className="adcard" style={{ marginBottom:14 }}>
            <h3 style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:15, color:C.white, marginBottom:16 }}>🔍 Basic SEO</h3>
            <div className="fg"><label className="lbl">Site Title (shown in browser tab & Google)</label><input value={f.siteTitle} onChange={e=>setF({...f,siteTitle:e.target.value})} style={{width:"100%"}} /></div>
            <div className="fg"><label className="lbl">Meta Description (155–160 chars recommended)</label><textarea rows={3} value={f.metaDesc} onChange={e=>setF({...f,metaDesc:e.target.value})} style={{width:"100%"}} /><p style={{color:C.muted,fontSize:11,marginTop:4}}>{f.metaDesc.length} / 160 chars</p></div>
            <div className="fg"><label className="lbl">Meta Keywords (comma separated)</label><input value={f.keywords} onChange={e=>setF({...f,keywords:e.target.value})} style={{width:"100%"}} /></div>
            <div className="fg"><label className="lbl">Canonical Domain</label><input value={f.canonicalDomain} onChange={e=>setF({...f,canonicalDomain:e.target.value})} placeholder="https://www.automor.com" style={{width:"100%"}} /></div>
          </div>
          <div className="adcard" style={{ marginBottom:14 }}>
            <h3 style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:15, color:C.white, marginBottom:16 }}>📱 Open Graph (Social Sharing)</h3>
            <ImgInput label="OG Image (1200×630px recommended)" val={f.ogImage} set={v=>setF({...f,ogImage:v})} />
          </div>
          <div className="adcard" style={{ marginBottom:14 }}>
            <h3 style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:15, color:C.white, marginBottom:16 }}>📊 Google Integration</h3>
            <div className="fgrid">
              <div className="fg"><label className="lbl">Google Analytics ID</label><input value={f.googleAnalyticsId} onChange={e=>setF({...f,googleAnalyticsId:e.target.value})} placeholder="G-XXXXXXXXXX" style={{width:"100%"}} /></div>
              <div className="fg"><label className="lbl">Google Search Console Verification</label><input value={f.googleVerification} onChange={e=>setF({...f,googleVerification:e.target.value})} placeholder="Verification code" style={{width:"100%"}} /></div>
            </div>
          </div>
          <div className="adcard" style={{ marginBottom:14 }}>
            <h3 style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:15, color:C.white, marginBottom:16 }}>🤖 Robots & Indexing</h3>
            <div className="fg"><label className="lbl">Robots Directive</label>
              <select value={f.robots} onChange={e=>setF({...f,robots:e.target.value})} style={{width:"100%"}}>
                <option value="index, follow">index, follow (recommended)</option>
                <option value="noindex, nofollow">noindex, nofollow (hide from Google)</option>
                <option value="index, nofollow">index, nofollow</option>
              </select>
            </div>
          </div>
          <div className="adcard" style={{ background:"rgba(96,165,250,0.05)", border:"1px solid rgba(96,165,250,0.2)", marginBottom:14 }}>
            <h3 style={{ color:C.blue, fontSize:14, fontWeight:600, marginBottom:10 }}>ℹ️ SEO Implementation Note</h3>
            <p style={{ color:C.sub, fontSize:13, lineHeight:1.7 }}>
              In this React SPA, SEO tags are stored and ready to export. For production deployment on Hostinger, these values are injected into the <code style={{color:C.accent,background:C.el,padding:"1px 4px",borderRadius:2}}>&lt;head&gt;</code> of your HTML file or via a framework like Next.js for full server-side rendering and Google crawlability.
            </p>
          </div>
          <SaveBtn onSave={save} saved={saved} />
        </div>
      );
    }

    /* BRAND / CONTACT */
    if (tab==="brand") {
      const [f, setF] = useState({...brand});
      const [saved, setSaved] = useState(false);
      const save = () => { setBrand(f); setSaved(true); setTimeout(()=>setSaved(false),2000); };
      return (
        <div>
          <Hdr title="Contact & Brand Info" action={<SaveBtn onSave={save} saved={saved} />} />
          <div className="adcard" style={{ marginBottom:14 }}>
            <div className="fgrid">
              <div className="fg"><label className="lbl">Brand Name</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} style={{width:"100%"}} /></div>
              <div className="fg"><label className="lbl">Email</label><input value={f.email} onChange={e=>setF({...f,email:e.target.value})} style={{width:"100%"}} /></div>
              <div className="fg"><label className="lbl">Phone</label><input value={f.phone} onChange={e=>setF({...f,phone:e.target.value})} style={{width:"100%"}} /></div>
              <div className="fg"><label className="lbl">Address</label><input value={f.address} onChange={e=>setF({...f,address:e.target.value})} style={{width:"100%"}} /></div>
            </div>
          </div>
          <div className="adcard" style={{ marginBottom:14 }}>
            <h3 style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:15, color:C.white, marginBottom:14 }}>Social Media Links</h3>
            <div className="fgrid">
              {["linkedin","twitter","youtube","instagram"].map(k=>(
                <div key={k} className="fg"><label className="lbl">{k.charAt(0).toUpperCase()+k.slice(1)} URL</label><input value={f.social?.[k]||""} onChange={e=>setF({...f,social:{...f.social,[k]:e.target.value}})} placeholder="https://…" style={{width:"100%"}} /></div>
              ))}
            </div>
          </div>
          <div className="adcard" style={{ marginBottom:14 }}>
            <h3 style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:15, color:C.white, marginBottom:14 }}>Stats Strip (Hero section)</h3>
            {f.stats.map((s,i)=>(
              <div key={i} style={{ display:"flex", gap:8, marginBottom:10 }}>
                <input value={s.value} onChange={e=>{ const st=[...f.stats]; st[i]={...st[i],value:e.target.value}; setF({...f,stats:st}); }} placeholder="Value (e.g. 6,000+)" style={{flex:1}} />
                <input value={s.label} onChange={e=>{ const st=[...f.stats]; st[i]={...st[i],label:e.target.value}; setF({...f,stats:st}); }} placeholder="Label (e.g. SKUs Available)" style={{flex:1}} />
              </div>
            ))}
          </div>
          <SaveBtn onSave={save} saved={saved} />
        </div>
      );
    }

    /* INQUIRIES */
    if (tab==="inquiries") return (
      <div>
        <Hdr title={`Inquiries (${inquiries.length})`} />
        {inquiries.length===0
          ? <div className="adcard" style={{ textAlign:"center", padding:40 }}><Ic.Inbox /><p style={{ color:C.sub, marginTop:12 }}>No inquiries received yet.</p></div>
          : <div style={{ overflowX:"auto" }}><table className="adtbl">
              <thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Time</th><th>Message</th></tr></thead>
              <tbody>
                {[...inquiries].reverse().map((inq,i)=>(
                  <tr key={i}>
                    <td style={{ color:C.white, fontWeight:500 }}>{inq.name}</td>
                    <td style={{ color:C.sub }}>{inq.email}</td>
                    <td style={{ color:C.sub }}>{inq.company||"—"}</td>
                    <td style={{ color:C.muted, fontFamily:"'Space Mono',monospace", fontSize:10 }}>{inq.time}</td>
                    <td style={{ color:C.sub, maxWidth:200 }}><div style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{inq.message}</div></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        }
      </div>
    );
  };

  return (
    <div className="adlay">
      <GS />
      <div className="adside">
        <div style={{ padding:isMob?"10px 10px 0":"16px 16px 10px", borderBottom:`1px solid #1e1e21`, display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
          <div style={{ width:26, height:26, background:C.accent, display:"flex", alignItems:"center", justifyContent:"center", clipPath:"polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)", flexShrink:0 }}>
            <span style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:12, color:"#fff" }}>A</span>
          </div>
          {!isMob && <span style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:13, color:C.white, letterSpacing:2 }}>CMS ADMIN</span>}
        </div>
        <nav style={{ flex:1, paddingTop:isMob?0:6, display:isMob?"flex":"block", overflowX:isMob?"auto":"visible" }}>
          {navItems.map(([id,label,icon])=>(
            <button key={id} className={`adnav${tab===id?" on":""}`} onClick={()=>{setTab(id);setShowForm(false);setEditItem(null);}}>
              <span>{icon}</span><span>{label}</span>
            </button>
          ))}
        </nav>
        {!isMob && (
          <div style={{ padding:"10px 14px", borderTop:`1px solid #1e1e21` }}>
            <button className="bo bsm bfull" onClick={onExit}>← Exit Admin</button>
          </div>
        )}
      </div>
      <div className="admain">
        <div style={{ padding:isMob?"16px 14px":"26px 30px" }}>
          {isMob && <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:14 }}><button className="bo bsm" onClick={onExit}>← Exit Admin</button></div>}
          {renderTab()}
        </div>
      </div>
    </div>
  );
}

/* ─── HEADER ──────────────────────────────────────────────── */
function Header({ nav, page, header, brand }) {
  const [mOpen, setMOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => { const h = () => setScrolled(window.scrollY > 10); window.addEventListener("scroll", h); return () => window.removeEventListener("scroll", h); }, []);
  const active = p => page===p || (p==="categories" && ["categories","products","product"].includes(page));
  return (
    <header style={{ position:"fixed", top:0, left:0, right:0, zIndex:1000, background:scrolled?"rgba(8,8,9,0.97)":"transparent", borderBottom:scrolled?`1px solid ${C.border}`:"1px solid transparent", backdropFilter:scrolled?"blur(14px)":"none", transition:"all 0.3s" }}>
      <div className="mw" style={{ padding:"0 20px", display:"flex", alignItems:"center", justifyContent:"space-between", height:60 }}>
        <button onClick={()=>{nav("home");setMOpen(false);}} style={{ display:"flex", alignItems:"center", gap:9 }}>
          {header.logo
            ? <img src={header.logo} alt={header.logoText} style={{ height:36, maxWidth:120, objectFit:"contain" }} />

/* ─── PAGE: PRODUCT AUTHENTICITY VERIFICATION ────────────── */
function VerifyPage({ code, products, brand, header, onExit }) {
  const product = products.find(p => (p.verifyCode||p.sku) === code);
  const valid = !!product;
  const timestamp = new Date().toLocaleString("en-US",{dateStyle:"long",timeStyle:"short"});

  return (
    <div style={{ minHeight:"100vh", background:"#050607", display:"flex", flexDirection:"column" }}>
      <GS />
      {/* Top bar */}
      <div style={{ borderBottom:`1px solid ${C.border}`, padding:"0 24px", display:"flex", alignItems:"center", height:58, background:"rgba(5,6,7,0.95)", backdropFilter:"blur(12px)", position:"sticky", top:0, zIndex:100 }}>
        <div style={{ display:"flex", alignItems:"center", gap:9, flex:1 }}>
          {header.logo
            ? <img src={header.logo} alt={header.logoText} style={{ height:30, objectFit:"contain" }} />
            : <><div style={{ width:28, height:28, background:C.accent, display:"flex", alignItems:"center", justifyContent:"center", clipPath:"polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)" }}><span style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:13, color:"#fff" }}>{(header.logoText||"A")[0]}</span></div>
               <span style={{ fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:16, color:C.white, letterSpacing:3 }}>{header.logoText}</span></>
          }
        </div>
        <span style={{ fontFamily:"'Space Mono',monospace", fontSize:9, color:C.muted, letterSpacing:2.5, textTransform:"uppercase" }}>PRODUCT AUTHENTICITY VERIFICATION</span>
        <div style={{ flex:1, display:"flex", justifyContent:"flex-end" }}>
          <button onClick={onExit} className="bo bsm">← Back to Site</button>
        </div>
      </div>

      {/* Main content */}
      <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", padding:"48px 20px" }}>
        {valid
          ? <VerifySuccess product={product} brand={brand} timestamp={timestamp} code={code} onExit={onExit} />
          : <VerifyFail code={code} brand={brand} onExit={onExit} />
        }
      </div>

      {/* Footer */}
      <div style={{ borderTop:`1px solid ${C.border}`, padding:"16px 24px", textAlign:"center" }}>
        <p style={{ color:C.muted, fontSize:11 }}>{brand.name} Authenticity System · {brand.email} · {new Date().getFullYear()}</p>
      </div>
    </div>

/* ─── MAIN APP ────────────────────────────────────────────── */
function App() {
  const [page, setPage] = useState("home");
  const [selCat, setSelCat] = useState(null);
  const [selProduct, setSelProduct] = useState(null);
  const [selPost, setSelPost] = useState(null);
  const [adminMode, setAdminMode] = useState(false);
  const [showLogin, setShowLogin] = useState(false);

  /* CMS STATE — all editable via admin */
  const [brand,    setBrand]    = useState(INIT_BRAND);
  const [header,   setHeader]   = useState(INIT_HEADER);
  const [homeData, setHomeData] = useState(INIT_HOME);
  const [footer,   setFooter]   = useState(INIT_FOOTER);
  const [seo,      setSeo]      = useState(INIT_SEO);
  const [products, setProducts] = useState(INIT_PRODUCTS);
  const [categories, setCategories] = useState(INIT_CATEGORIES);
  const [blog,     setBlog]     = useState(INIT_BLOG);
  const [faq,      setFaq]      = useState(INIT_FAQ);
  const [inquiries, setInquiries] = useState([]);

  // Verification page state
  const [verifyMode, setVerifyMode] = useState(false);
  const [verifyCode, setVerifyCode] = useState("");

  /* 🔒 SECURE ADMIN ACCESS — Two hidden methods, zero public links
     ═══════════════════════════════════════════════════════════════

     METHOD 1 — Secret URL (for live deployed website):
       Go to:  https://yoursite.com/#admin
       • Login modal opens instantly
       • #admin erased from address bar immediately — no trace

     METHOD 2 — Keyboard shortcut (works in preview / iframe too):
       Click inside the page first, then press:
       • Ctrl + Shift + A  (Windows / Linux)
       • Cmd  + Shift + A  (Mac)

     Both methods are completely invisible to regular visitors.
     ═══════════════════════════════════════════════════════════════ */
  useEffect(() => {
    // Handle all hash-based routing
    const checkHash = () => {
      const hash = window.location.hash;
      // Admin access
      if (hash === "#admin" && !adminMode) {
        window.history.replaceState(null, "", window.location.pathname + window.location.search);
        setShowLogin(true);
        return;
      }
      // Product verification: #verify/CODE
      if (hash.startsWith("#verify/")) {
        const code = hash.replace("#verify/", "").trim();
        window.history.replaceState(null, "", window.location.pathname + window.location.search);
        if (code) { setVerifyCode(code); setVerifyMode(true); }
        return;
      }
    };
    checkHash();
    window.addEventListener("hashchange", checkHash);

    // Keyboard shortcut — Ctrl/Cmd+Shift+A (works in preview/iframe)
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "A") {
        e.preventDefault();
        if (!adminMode) setShowLogin(true);
      }
    };
    window.addEventListener("keydown", onKey);

    return () => {
      window.removeEventListener("hashchange", checkHash);
      window.removeEventListener("keydown", onKey);
    };
  }, [adminMode]);

  const nav = (p, extra={}) => {
    setVerifyMode(false); // always exit verify on nav
    setPage(p);
    if (extra.cat !== undefined) setSelCat(extra.cat);
    if (extra.product !== undefined) setSelProduct(extra.product);
    if (extra.post !== undefined) setSelPost(extra.post);
    window.scrollTo({ top:0, behavior:"smooth" });
  };

  // Show verification page
  if (verifyMode) return (
    <VerifyPage
      code={verifyCode}
      products={products}
      brand={brand}
      header={header}
      onExit={() => { setVerifyMode(false); nav("home"); }}
    />
  );

  if (adminMode) return (
    <AdminPanel onExit={()=>setAdminMode(false)}
      products={products} setProducts={setProducts}
      categories={categories} setCategories={setCategories}
      blog={blog} setBlog={setBlog}
      faq={faq} setFaq={setFaq}
      brand={brand} setBrand={setBrand}
      inquiries={inquiries}
      header={header} setHeader={setHeader}
      homeData={homeData} setHomeData={setHomeData}
      footer={footer} setFooter={setFooter}
      seo={seo} setSeo={setSeo}
    />
  );

  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      <GS />
      {showLogin && (
        <AdminLogin
          onSuccess={() => { setShowLogin(false); setAdminMode(true); }}
          onClose={() => setShowLogin(false)}
        />
      )}
      <Header nav={nav} page={page} header={header} brand={brand} />
      <main>
        {page==="home"       && <Home       nav={nav} brand={brand} products={products} categories={categories} blog={blog} homeData={homeData} />}
        {page==="categories" && <CatPage    nav={nav} categories={categories} products={products} />}
        {page==="products"   && <ProdList   nav={nav} cat={selCat} products={products} categories={categories} />}
        {page==="product"    && <ProdDetail nav={nav} productId={selProduct} products={products} categories={categories} setVerifyMode={setVerifyMode} setVerifyCode={setVerifyCode} />}
        {page==="about"      && <About      nav={nav} brand={brand} />}
        {page==="contact"    && <Contact    brand={brand} addInquiry={inq=>setInquiries([...inquiries,inq])} />}
        {page==="faq"        && <FAQPage    faq={faq} />}
        {page==="blog"       && <BlogPage   nav={nav} postId={selPost} blog={blog} />}
      </main>
      <Footer nav={nav} brand={brand} categories={categories} footer={footer} />
    </div>
  );
}


// Mount the app
const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(<App />);

// Remove loading screen once React has rendered
const _loading = document.getElementById('loading');
if (_loading) _loading.style.display = 'none';
  </script>
</body>
