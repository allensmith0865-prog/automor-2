function ImgInput({ label, val, set }) {
  return (
    <div className="fg">
      {label && <label className="lbl">{label}</label>}
      <div style={{display:"flex",gap:8}}>
        <input placeholder="Paste image URL or upload →" value={val?.startsWith?.("data:")?"✓ Image uploaded":(val||"")} onChange={e=>set(e.target.value)} style={{flex:1}} />
        <label className="bo bsm" style={{cursor:"pointer",flexShrink:0,display:"inline-flex",alignItems:"center",gap:5}}>
          <Ic.Img/> Upload
          <input type="file" accept="image/*" hidden onChange={e=>{if(e.target.files[0])readFile(e.target.files[0],set)}} />
        </label>
      </div>
      {val&&<img src={val} alt="" style={{marginTop:8,height:70,borderRadius:3,border:`1px solid ${C.border}`,objectFit:"cover",maxWidth:140}} onError={e=>e.target.style.display="none"} />}
    </div>
  );
}
function PdfInput({ label, val, set }) {
  return (
    <div className="fg">
      {label && <label className="lbl">{label}</label>}
      <div style={{display:"flex",gap:8}}>
        <input placeholder="Paste PDF URL or upload →" value={val?.startsWith?.("data:")?"✓ PDF uploaded":(val||"")} onChange={e=>set(e.target.value)} style={{flex:1}} />
        <label className="bo bsm" style={{cursor:"pointer",flexShrink:0,display:"inline-flex",alignItems:"center",gap:5}}>
          <Ic.File/> Upload PDF
          <input type="file" accept=".pdf,application/pdf" hidden onChange={e=>{if(e.target.files[0])readFile(e.target.files[0],set)}} />
        </label>
      </div>
      {val&&<div style={{marginTop:8,display:"flex",alignItems:"center",gap:8,background:C.el,padding:"7px 12px",borderRadius:3,border:`1px solid ${C.border}`}}><Ic.File/><span style={{color:C.green,fontSize:12}}>PDF ready for download</span></div>}
    </div>
  );
}
function GalleryPicker({ images=[], onChange }) {
  const [url, setUrl] = useState("");
  const add = src => onChange([...images, src]);
  const del = i  => onChange(images.filter((_,x)=>x!==i));
  return (
    <div className="fg">
      <label className="lbl">Gallery Images</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
        {images.map((img,i)=>(
          <div key={i} style={{position:"relative",width:74,height:74}}>
            <img src={img} alt="" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:3,border:`1px solid ${C.border}`}} />
            <button onClick={()=>del(i)} style={{position:"absolute",top:-5,right:-5,width:18,height:18,background:C.red,color:"#fff",borderRadius:"50%",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",border:"none",cursor:"pointer"}}>×</button>
            {i===0&&<div style={{position:"absolute",bottom:2,left:2,background:C.accent,fontSize:7,color:"#fff",padding:"1px 4px",borderRadius:2,fontFamily:"'Space Mono',monospace"}}>MAIN</div>}
          </div>
        ))}
        <label style={{width:74,height:74,background:C.el,border:`2px dashed ${C.border}`,borderRadius:3,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",color:C.sub,gap:4,fontSize:11}}>
          <Ic.Plus/>Add
          <input type="file" accept="image/*" hidden multiple onChange={e=>{[...e.target.files].forEach(f=>readFile(f,add))}} />
        </label>
      </div>
      <div style={{display:"flex",gap:8}}>
        <input placeholder="Or paste URL + Enter" value={url} onChange={e=>setUrl(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&url){add(url);setUrl("")}}} />
      </div>
    </div>
  );
}
function Saved({ show }) {
  if (!show) return null;
  return <span style={{color:C.green,fontSize:12,display:"inline-flex",alignItems:"center",gap:5,marginLeft:10}}><Ic.Chk/>Saved!</span>;
}
function AHdr({ title, action }) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <h2 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:22,color:C.white}}>{title}</h2>
      {action}
    </div>
  );
}

function TabBrand({ brand, setBrand }) {
  const [f, setF] = useState({...brand, social:{...brand.social}, stats:brand.stats.map(s=>({...s}))});
  const [saved, setSaved] = useState(false);
  const save = () => { setBrand({...f}); setSaved(true); setTimeout(()=>setSaved(false),2500); };
  const upStat = (i,k,v) => { const s=[...f.stats]; s[i]={...s[i],[k]:v}; setF({...f,stats:s}); };
  return (
    <div>
      <AHdr title="Brand & Contact Settings" action={<div style={{display:"flex",alignItems:"center"}}><button className="bp" onClick={save}>Save Changes</button><Saved show={saved}/></div>} />

        <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:14,color:C.white,marginBottom:14}}>Brand Identity</h3>
        <div className="fg2">
          <div className="fg"><label className="lbl">Brand Name *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
          <div className="fg"><label className="lbl">Tagline</label><input value={f.tagline} onChange={e=>setF({...f,tagline:e.target.value})} /></div>
        </div>
        <div className="fg"><label className="lbl">Sub-tagline / Hero Text</label><input value={f.subline} onChange={e=>setF({...f,subline:e.target.value})} /></div>
      </div>
      <div className="adcard" style={{marginBottom:14}}>
        <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:14,color:C.white,marginBottom:14}}>Contact Information</h3>
        <div className="fg2">
          <div className="fg"><label className="lbl">Email *</label><input value={f.email} onChange={e=>setF({...f,email:e.target.value})} /></div>
          <div className="fg"><label className="lbl">Phone *</label><input value={f.phone} onChange={e=>setF({...f,phone:e.target.value})} /></div>
        </div>
        <div className="fg"><label className="lbl">Address</label><input value={f.address} onChange={e=>setF({...f,address:e.target.value})} /></div>
      </div>
      <div className="adcard" style={{marginBottom:14}}>
        <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:14,color:C.white,marginBottom:14}}>Social Media Links</h3>
        <div className="fg2">
          {["linkedin","twitter","youtube","instagram"].map(k=>(
            <div key={k} className="fg"><label className="lbl">{k.charAt(0).toUpperCase()+k.slice(1)}</label><input value={f.social[k]||""} onChange={e=>setF({...f,social:{...f.social,[k]:e.target.value}})} placeholder="https://…" /></div>
          ))}
        </div>
      </div>
      <div className="adcard" style={{marginBottom:14}}>
        <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:14,color:C.white,marginBottom:14}}>Homepage Stats Strip</h3>
        {f.stats.map((s,i)=>(

/* ══════════════════════════════════════════════════════════════
   ADMIN TAB: CATEGORIES (full CRUD including add new)
══════════════════════════════════════════════════════════════ */
function TabCategories({ categories, setCategories, products }) {
  const [editing, setEditing] = useState(null);
  const [adding,  setAdding]  = useState(false);
  const [newCat,  setNewCat]  = useState({id:"",name:"",count:0,image:"",description:""});

  const saveEdit = () => { setCategories(categories.map(c=>c.id===editing.id?editing:c)); setEditing(null); };
  const saveNew  = () => {
    if (!newCat.name) { alert("Category name required"); return; }
    const id = slugify(newCat.name);
    if (categories.find(c=>c.id===id)) { alert("A category with this name already exists"); return; }
    setCategories([...categories, {...newCat, id}]);
    setNewCat({id:"",name:"",count:0,image:"",description:""});
    setAdding(false);
  };
  const deleteCat = cat => {
    const cnt = products.filter(p=>p.category===cat.id).length;
    if (cnt>0 && !window.confirm(`This category has ${cnt} product(s). Delete anyway?`)) return;
    setCategories(categories.filter(c=>c.id!==cat.id));
  };

  const CatForm = ({ f, setF, onSave, onCancel, title }) => (
    <div className="adcard fu" style={{marginBottom:14}}>
      <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:16,color:C.white,marginBottom:16}}>{title}</h3>
      <div className="fg2">
        <div className="fg"><label className="lbl">Category Name *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
        <div className="fg"><label className="lbl">Display Count</label><input type="number" value={f.count} onChange={e=>setF({...f,count:parseInt(e.target.value)||0})} /></div>
      </div>
      <div className="fg"><label className="lbl">Description</label><textarea rows={2} value={f.description} onChange={e=>setF({...f,description:e.target.value})} /></div>
      <ImgInput label="Category Card Image" val={f.image} set={v=>setF({...f,image:v})} />
      <div style={{display:"flex",gap:10,marginTop:6}}>
        <button className="bp" onClick={onSave}>Save Category</button>
        <button className="bo" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );

  return (
    <div>
      <AHdr title={`Categories (${categories.length})`} action={!adding&&<button className="bp bsm" onClick={()=>{setAdding(true);setEditing(null)}}><Ic.Plus/>Add Category</button>} />
      {adding && <CatForm f={newCat} setF={setNewCat} onSave={saveNew} onCancel={()=>setAdding(false)} title="Add New Category" />}
      {editing && <CatForm f={editing} setF={setEditing} onSave={saveEdit} onCancel={()=>setEditing(null)} title={`Edit: ${editing.name}`} />}
      <div style={{overflowX:"auto"}}>
        <table className="adtbl">
          <thead><tr><th>Category</th><th>ID</th><th>Products</th><th>Actions</th></tr></thead>
          <tbody>
            {categories.map(cat=>(
              <tr key={cat.id}>
                <td>
                  <div style={{display:"flex",gap:9,alignItems:"center"}}>
                    <div style={{width:38,height:38,borderRadius:3,overflow:"hidden",background:C.el,flexShrink:0}}>
                      {cat.image&&<img src={cat.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} />}
                    </div>
                    <span style={{color:C.white,fontWeight:500}}>{cat.name}</span>
                  </div>
                </td>
                <td><span className="sku">{cat.id}</span></td>
                <td style={{color:C.sub}}>{products.filter(p=>p.category===cat.id).length}</td>
                <td>
                  <div style={{display:"flex",gap:5}}>
                    <button className="bo bsm" onClick={()=>{setEditing({...cat});setAdding(false)}}><Ic.Edit/></button>
                    <button className="bo bsm bred" onClick={()=>deleteCat(cat)}><Ic.Trash/></button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   ADMIN LOGIN
══════════════════════════════════════════════════════════════ */
function AdminLogin({ onSuccess, onClose, adminPw }) {
  const [pw,setPw]=useState(""); const [err,setErr]=useState(""); const [attempts,setAttempts]=useState(0); const [lockUntil,setLockUntil]=useState(0); const [cd,setCd]=useState(0);
  useEffect(()=>{
    if(lockUntil<=0)return;
    const t=setInterval(()=>{ const r=Math.ceil((lockUntil-Date.now())/1000); if(r<=0){setLockUntil(0);setCd(0);setAttempts(0);setErr("");clearInterval(t);}else setCd(r); },400);
    return()=>clearInterval(t);
  },[lockUntil]);
  const login=()=>{
    if(Date.now()<lockUntil){setErr(`Locked — wait ${cd}s`);return;}
    if(pw===adminPw){onSuccess();}
    else{
      const na=attempts+1; setAttempts(na);
      if(na>=3){const u=Date.now()+30000;setLockUntil(u);setErr("Too many attempts. Locked 30s.");}
      else setErr(`Incorrect password. ${3-na} attempt(s) left.`);
    }
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.96)",backdropFilter:"blur(8px)",zIndex:9998,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="fu adcard" style={{maxWidth:380,width:"100%",padding:"36px 32px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:24}}>
          <div style={{width:38,height:38,background:C.accent,borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}><Ic.Lock/></div>
          <div><div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:18,color:C.white}}>Admin Access</div><div style={{color:C.muted,fontSize:11}}>Content Management System</div></div>
        </div>
        <div style={{background:C.accentD,border:"1px solid rgba(232,96,26,.2)",borderRadius:3,padding:"10px 14px",marginBottom:20,fontSize:12,color:C.sub}}>🔒 Restricted — Authorised personnel only.</div>
        <label className="lbl">Password</label>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="Enter admin password…" autoFocus style={{marginBottom:6}} />
        {err&&<p style={{color:C.red,fontSize:12,marginBottom:8}}>{err}{cd>0&&` (${cd}s)`}</p>}
        <button className="bp bfull" style={{marginTop:10}} onClick={login} disabled={Date.now()<lockUntil}>Sign In</button>
        <button onClick={onClose} style={{display:"block",width:"100%",textAlign:"center",color:C.muted,fontSize:12,marginTop:12}}>← Cancel</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════════════════ */
function SiteHeader({ nav, page, header, brand }) {
  const [mOpen,setMOpen]=useState(false);
  const [scrolled,setScrolled]=useState(false);
  useEffect(()=>{const h=()=>setScrolled(window.scrollY>10);window.addEventListener("scroll",h);return()=>window.removeEventListener("scroll",h);},[]);
  const active=p=>page===p||(p==="categories"&&["categories","products","product"].includes(page));
  return (
    <header style={{position:"fixed",top:0,left:0,right:0,zIndex:1000,background:scrolled?"rgba(8,8,9,0.97)":"transparent",borderBottom:scrolled?`1px solid ${C.border}`:"1px solid transparent",backdropFilter:scrolled?"blur(14px)":"none",transition:"all .3s"}}>
      <div className="mw" style={{padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60}}>
        <button onClick={()=>{nav("home");setMOpen(false);}} style={{display:"flex",alignItems:"center",gap:9}}>
          {header.logo
            ? <img src={header.logo} alt={header.logoText} style={{height:34,maxWidth:120,objectFit:"contain"}} />
            : <><div style={{width:30,height:30,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center",clipPath:"polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)"}}><span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:14,color:"#fff"}}>{(header.logoText||"A")[0]}</span></div>
               <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:18,color:C.white,letterSpacing:3}}>{header.logoText}</span></>}
        </button>
        <nav className="nd">
          {header.navLinks.map(l=>(
            <button key={l.id} onClick={()=>nav(l.page)} style={{color:active(l.page)?C.accent:C.sub,fontSize:13,fontWeight:500,padding:"7px 12px",borderRadius:3,transition:"color .2s"}} onMouseEnter={e=>{if(!active(l.page))e.target.style.color=C.text;}} onMouseLeave={e=>{if(!active(l.page))e.target.style.color=C.sub;}}>{l.label}</button>
          ))}
          <div style={{width:1,height:18,background:C.border,margin:"0 8px"}} />
          <button className="bp" style={{padding:"9px 18px",fontSize:12}} onClick={()=>nav(header.ctaPage)}>{header.ctaText}</button>
        </nav>
        <button className="nmb" onClick={()=>setMOpen(!mOpen)}>{mOpen?<Ic.X/>:<Ic.Menu/>}</button>
      </div>
      {mOpen&&(
        <div className="fu" style={{background:C.card,borderTop:`1px solid ${C.border}`,padding:"12px 20px 20px"}}>
          {header.navLinks.map(l=>(
            <button key={l.id} onClick={()=>{nav(l.page);setMOpen(false);}} style={{display:"block",width:"100%",textAlign:"left",color:active(l.page)?C.accent:C.text,fontSize:15,padding:"11px 0",borderBottom:`1px solid ${C.border}`}}>{l.label}</button>
          ))}
          <button className="bp bfull" style={{marginTop:16}} onClick={()=>{nav(header.ctaPage);setMOpen(false);}}>{header.ctaText}</button>
        </div>
      )}
    </header>
  );
}

                  <h2 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"clamp(17px,2.5vw,22px)",color:C.white,lineHeight:1.25,marginBottom:12}}>{blog[0].title}</h2>
                  <p style={{color:C.sub,fontSize:13,lineHeight:1.7,marginBottom:18}}>{blog[0].excerpt}</p>
                  <div style={{color:C.accent,fontSize:12,display:"flex",alignItems:"center",gap:5,fontWeight:500}}>Read Article <Ic.Arrow/></div>
                </div>
              </div>
            )}
            <div className="gblog">
              {blog.slice(1).map(p=>(
                <div key={p.id} className="ch" onClick={()=>setPost(p)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,overflow:"hidden",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.borderColor="rgba(232,96,26,.38)"} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{height:178,overflow:"hidden"}}>{p.image&&<img src={p.image} alt={p.title} style={{width:"100%",height:"100%",objectFit:"cover"}} />}</div>
                  <div style={{padding:"17px 17px"}}>
                    <div style={{display:"flex",gap:8,marginBottom:9}}><span className="sku">{p.category}</span><span style={{color:C.muted,fontSize:10,fontFamily:"'Space Mono',monospace"}}>{p.date}</span></div>
                    <h3 style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:600,fontSize:16,color:C.white,lineHeight:1.3,marginBottom:8}}>{p.title}</h3>
                    <p style={{color:C.sub,fontSize:12,lineHeight:1.65,marginBottom:12}}>{p.excerpt?.slice(0,90)}…</p>
                    <div style={{color:C.accent,fontSize:12,display:"flex",alignItems:"center",gap:5,fontWeight:500}}>Read Article <Ic.Arrow/></div>
                  </div>
                </div>
              ))}
            </div>
          </>}
      </div>
    </div>
  );
}

    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════════════ */
function App() {
  const [page,     setPage]     = useState("home");
  const [selCat,   setSelCat]   = useState(null);
  const [selProd,  setSelProd]  = useState(null);
  const [selPost,  setSelPost]  = useState(null);
  const [verifyMode, setVerifyMode] = useState(false);
  const [verifyCode, setVerifyCode] = useState("");
  const [adminMode,  setAdminMode]  = useState(false);
  const [showLogin,  setShowLogin]  = useState(false);

  // ── All CMS state — admin edits these, frontend reads them ──
  const [brand,     setBrand]     = useState(INIT.brand);
  const [header,    setHeader]    = useState(INIT.header);
  const [homeData,  setHomeData]  = useState(INIT.home);
  const [footer,    setFooter]    = useState(INIT.footer);
  const [seo,       setSeo]       = useState(INIT.seo);
  const [products,  setProducts]  = useState(INIT.products);
  const [categories,setCategories]= useState(INIT.categories);
  const [blog,      setBlog]      = useState(INIT.blog);
  const [faq,       setFaq]       = useState(INIT.faq);
  const [inquiries, setInquiries] = useState([]);
  const [adminPw,   setAdminPw]   = useState(INIT_PW);

  // ── Hidden admin access ──
  useEffect(()=>{
    const checkHash=()=>{
      const hash=window.location.hash;
      if(hash==="#admin"&&!adminMode){
        window.history.replaceState(null,"",window.location.pathname+window.location.search);
        setShowLogin(true); return;
      }
      if(hash.startsWith("#verify/")){
        const code=hash.replace("#verify/","").trim();
        window.history.replaceState(null,"",window.location.pathname+window.location.search);
        if(code){setVerifyCode(code);setVerifyMode(true);} return;
      }
    };
    checkHash();
    window.addEventListener("hashchange",checkHash);
    const onKey=e=>{
      if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==="A"){e.preventDefault();if(!adminMode)setShowLogin(true);}
    };
    window.addEventListener("keydown",onKey);
    return()=>{ window.removeEventListener("hashchange",checkHash); window.removeEventListener("keydown",onKey); };
  },[adminMode]);

  const nav=(p,extra={})=>{
    setVerifyMode(false);
    setPage(p);
    if(extra.cat!==undefined)     setSelCat(extra.cat);
    if(extra.product!==undefined) setSelProd(extra.product);
    if(extra.post!==undefined)    setSelPost(extra.post);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  // ── Render modes ──
  if(verifyMode) return <PageVerify code={verifyCode} products={products} brand={brand} header={header} onExit={()=>{setVerifyMode(false);nav("home");}}/>;

  if(adminMode) return (
    <AdminPanel onExit={()=>setAdminMode(false)}
      brand={brand} setBrand={setBrand}
      header={header} setHeader={setHeader}
      homeData={homeData} setHomeData={setHomeData}
      footer={footer} setFooter={setFooter}
      seo={seo} setSeo={setSeo}
      products={products} setProducts={setProducts}
      categories={categories} setCategories={setCategories}
      blog={blog} setBlog={setBlog}
      faq={faq} setFaq={setFaq}
      adminPw={adminPw} setAdminPw={setAdminPw}
      inquiries={inquiries}
    />
  );

  return (
    <div style={{background:C.bg,minHeight:"100vh"}}>
      <GS/>
      {showLogin&&<AdminLogin onSuccess={()=>{setShowLogin(false);setAdminMode(true);}} onClose={()=>setShowLogin(false)} adminPw={adminPw} />}
      <SiteHeader nav={nav} page={page} header={header} brand={brand} />
      <main>
        {page==="home"       && <PageHome       nav={nav} brand={brand} products={products} categories={categories} blog={blog} homeData={homeData} />}
        {page==="categories" && <PageCats       nav={nav} categories={categories} products={products} />}
        {page==="products"   && <PageProdList   nav={nav} cat={selCat} products={products} categories={categories} />}
        {page==="product"    && <PageProdDetail nav={nav} productId={selProd} products={products} categories={categories} />}
        {page==="about"      && <PageAbout      nav={nav} brand={brand} />}
        {page==="contact"    && <PageContact    brand={brand} addInquiry={inq=>setInquiries([...inquiries,inq])} />}
        {page==="faq"        && <PageFAQ        faq={faq} />}
        {page==="blog"       && <PageBlog       nav={nav} postId={selPost} blog={blog} />}
      </main>
      <SiteFooter nav={nav} brand={brand} categories={categories} footer={footer} />
    </div>
  );
}

const _r = ReactDOM.createRoot(document.getElementById('root'));
_r.render(<App/>);
const _l = document.getElementById('loading');
if(_l) setTimeout(()=>_l.style.display='none', 100);
  </script>
</body>
</html>
